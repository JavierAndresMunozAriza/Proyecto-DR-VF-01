# Extra options of the cloud build (./build.sh cloud), on top of prj.conf.
# Based on the Nordic Asset Tracker Template (NCS v3.4.1), keeping only what
# the nRF Cloud CoAP adapter needs: no FOTA, no Memfault, no location.

CONFIG_DRVF_CLOUD=y

# Heap: nRF Cloud (cJSON, CBOR), provisioning and the CoAP client allocate
CONFIG_HEAP_MEM_POOL_SIZE=12288
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Some nRF Cloud credentials are longer than 1024 bytes
CONFIG_AT_MONITOR_HEAP_SIZE=2176

# Log buffer: the attestation token (about 600 characters) is one message
CONFIG_LOG_BUFFER_SIZE=4096

# Networking: sockets offloaded to the modem
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y

# LTE link: GNSS stays in the system mode so that both can run together
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_WORKQUEUE_STACK_SIZE=896
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=4096
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=4096

# PSM requested at modem start (same values as the Asset Tracker Template).
# The tracking area update period is longer than the sync interval.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PROPRIETARY_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=7200
# Short active time: the device polls for downlink data
CONFIG_LTE_PSM_REQ_RAT_SECONDS=6

# eDRX: "0000" is 5.12 s
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0000"
CONFIG_LTE_EDRX_REQ_VALUE_NBIOT="0000"

# Modem key management and JWT for the nRF Cloud authentication
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MODEM_JWT=y
CONFIG_MODEM_INFO=y

# nRF Cloud over CoAP
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=y
CONFIG_NRF_CLOUD_CREDENTIALS_MGMT_MODEM=y
CONFIG_NRF_CLOUD_COAP_MAX_RETRIES=3
CONFIG_NRF_CLOUD_COAP_DISCONNECT_ON_FAILED_REQUEST=y
CONFIG_NRF_CLOUD_COAP_MAX_USER_OPTIONS=0
CONFIG_NRF_CLOUD_PRINT_DETAILS=n
CONFIG_NRF_CLOUD_SEND_SHADOW_INFO_ON_CONNECT=n

# CoAP client: sized for a shadow delta of about 1.5 KB (a 532-byte fence is
# 712 base64 characters); blocks of 1024 bytes
CONFIG_COAP_MAX_RETRANSMIT=1
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000
CONFIG_COAP_CLIENT_THREAD_PRIORITY=14
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=1280
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=192
CONFIG_COAP_CLIENT_MAX_PATH_LENGTH=128
CONFIG_COAP_CLIENT_MAX_EXTRA_OPTIONS=3

# Date and time from the network (the JWT is signed with it)
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_LOG_LEVEL_ERR=y

# Shadow delta decoding (zephyr/data/json.h) and base64 of the fence
CONFIG_JSON_LIBRARY=y
CONFIG_BASE64=y

# nRF Provisioning: gets the nRF Cloud credentials. It stores its state with
# the settings subsystem; the NVS backend is chosen so that the fence storage
# can use settings on the same backend.
CONFIG_MODEM_ATTEST_TOKEN=y
CONFIG_NRF_PROVISIONING=y
CONFIG_NRF_PROVISIONING_COAP=y
CONFIG_NRF_PROVISIONING_CODEC=y
CONFIG_NRF_PROVISIONING_CBOR=y
CONFIG_NRF_PROVISIONING_CBOR_RECORDS=5
CONFIG_NRF_PROVISIONING_WITH_CERT=y
CONFIG_NRF_PROVISIONING_RX_BUF_SZ=2560
CONFIG_NRF_PROVISIONING_TX_BUF_SZ=2048
CONFIG_NRF_PROVISIONING_STACK_SIZE=3072
CONFIG_NRF_PROVISIONING_CODEC_AT_CMD_LEN=2048
CONFIG_NRF_PROVISIONING_CODEC_RX_SZ_START=1024
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Keep the downloaded fence in flash (settings on NVS, enabled above)
CONFIG_DRVF_FENCE_STORAGE=y

# The cloud build waits for the fence the user drew instead of making a square
# around the first fix (the offline proof of concept keeps that default)
CONFIG_DRVF_FENCE_AUTO_SQUARE=n
